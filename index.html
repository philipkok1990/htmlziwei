<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫微斗数排盘系统</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入 lunar-javascript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- 控制面板 -->
        <header class="control-panel">
            <h2>紫微斗数在线排盘</h2>
            <form id="ziwei-form">
                <div class="form-group">
                    <label for="gender">性别：</label>
                    <select id="gender">
                        <option value="male" selected>男</option>
                        <option value="female">女</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="birth-date">阳历日期：</label>
                    <input type="date" id="birth-date" value="1990-04-24" required>
                </div>

                <div class="form-group">
                    <label for="birth-time">阳历时间：</label>
                    <input type="time" id="birth-time" value="12:15" required>
                </div>

                <button type="submit" id="btn-submit">开始排盘</button>
            </form>
        </header>

        <!-- 命盘网格（12 宫格 + 中宫） -->
        <main class="chart-board" id="chart-board">
            <!-- 动态生成 12 宫位与中宫 -->
        </main>
    </div>

    <!-- JS 文件导入 -->
    <script src="dict.js"></script>
    <script src="ziwei.js"></script>
</body>
</html>
