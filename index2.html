<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>紫微斗数排盘系统 (极简Table+Tab版)</title>
    <link rel="stylesheet" href="style2.css">
    <!-- 引入 Lunar 农历依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
</head>
<body>

    <!-- 1. 顶部控制栏 -->
    <div class="top-bar">
        <label>预设人员：</label>
        <select id="personSelect"></select>

        <label>性别：</label>
        <select id="gender">
            <option value="male">男 (乾造)</option>
            <option value="female">女 (坤造)</option>
        </select>

        <label>阳历日期：</label>
        <input type="date" id="birthDate" value="1990-04-24">

        <label>时间：</label>
        <input type="time" id="birthTime" value="12:15">

        <button id="btnCalculate">开始排盘</button>
    </div>

    <!-- 2. 30% / 70% 左右分栏 -->
    <div class="main-container">
        <!-- 左侧 30%：12 宫位表格 -->
        <div class="left-panel">
            <h3>十二宫位简表</h3>
            <table>
                <thead>
                    <tr>
                        <th style="width: 30%;">宫位</th>
                        <th style="width: 20%;">地支</th>
                        <th style="width: 50%;">星曜 (含四化)</th>
                    </tr>
                </thead>
                <tbody id="palaceTableBody">
                    <!-- 动态生成 -->
                </tbody>
            </table>
        </div>

        <!-- 右侧 70%：Tab 总结与解说 -->
        <div class="right-panel">
            <div class="tab-header">
                <button class="tab-btn active" id="btnTabSummary" onclick="switchRightTab('summary')">命盘总结</button>
                <button class="tab-btn" id="btnTabPalace" onclick="switchRightTab('palace')">宫位星曜详解</button>
            </div>

            <div id="tabSummaryContent" class="tab-pane active">
                <!-- 命盘总结详情 -->
            </div>

            <div id="tabPalaceContent" class="tab-pane">
                <p>点击左侧表格中的任意宫位，即可在此查看该宫位的详细星曜配置。</p>
            </div>
        </div>
    </div>

    <!-- 依次引入脚本库 -->
    <script src="dict.js"></script>
    <script src="personal.js"></script>
    <script src="ziwei.js"></script>
    <script src="app.js"></script>
</body>
</html>
