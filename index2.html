<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>紫微斗数排盘系统 (运势日期范围 + 13解说Tab版)</title>
    <link rel="stylesheet" href="style2.css">
    <!-- 引入 Lunar 农历依赖库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/lunar.js"></script>
</head>
<body>

    <!-- 1. 顶部控制栏 -->
    <div class="top-bar">
        <label>预设人员：</label>
        <select id="personSelect"></select>

        <label>性别：</label>
        <select id="gender">
            <option value="male">男 (乾造)</option>
            <option value="female">女 (坤造)</option>
        </select>

        <label>阳历日期：</label>
        <input type="date" id="birthDate" value="1990-04-24">

        <label>时间：</label>
        <input type="time" id="birthTime" value="12:15">

        <button id="btnCalculate">开始排盘</button>
    </div>

    <!-- 2. 30% / 70% 左右分栏 -->
    <div class="main-container">
        <!-- 左侧 30%：运势快览卡片 + 12 宫位表格 -->
        <div class="left-panel">
            <div id="leftQuickInfo"></div>

            <h3>十二宫位简表</h3>
            <table>
                <thead>
                    <tr>
                        <th style="width: 25%;">宫位</th>
                        <th style="width: 15%;">地支</th>
                        <th style="width: 22%;">大运</th>
                        <th style="width: 38%;">星曜 (含四化)</th>
                    </tr>
                </thead>
                <tbody id="palaceTableBody">
                    <!-- 动态渲染 -->
                </tbody>
            </table>
        </div>

        <!-- 右侧 70%：多 Main TAB 区域 -->
        <div class="right-panel">
            <!-- Main TAB 导航 -->
            <div class="main-tab-header">
                <button class="main-tab-btn active" onclick="switchMainTab('tabSummary')">命盘总结</button>
                <button class="main-tab-btn" onclick="switchMainTab('tabFortune')">大运</button>
            </div>

            <!-- MAIN TAB 1: 命盘总结 (包含 13 个 Sub TAB) -->
            <div id="tabSummary" class="main-tab-content active">
                <div class="sub-tab-header" id="subTabHeaderSummary"></div>
                <div id="subTabContainerSummary"></div>
            </div>

            <!-- MAIN TAB 2: 大运 (包含 大运 -> 流年 -> 流月 多级级联，阳历日期区间 & 13Tab 解说) -->
            <div id="tabFortune" class="main-tab-content">
                <!-- 大运层 -->
                <div class="fortune-step-box">
                    <div class="step-title">选择大运：</div>
                    <div class="sub-tab-header" id="dayunTabHeader"></div>
                </div>

                <!-- 流年层 -->
                <div class="fortune-step-box" id="liunianBox" style="display: none;">
                    <div class="step-title">选择流年 <span class="tip-back">(再次点击所选大运可收起返回)</span>：</div>
                    <div class="sub-tab-header" id="liunianTabHeader"></div>
                </div>

                <!-- 流月层 -->
                <div class="fortune-step-box" id="liuyueBox" style="display: none;">
                    <div class="step-title">选择流月 <span class="tip-back">(再次点击所选流年可收起返回)</span>：</div>
                    <div class="sub-tab-header" id="liuyueTabHeader"></div>
                </div>

                <!-- 运势层级的 13 解说 TAB Header 与 Container -->
                <div class="card-section" id="fortuneDetailSection" style="margin-top: 15px;">
                    <div id="fortuneTitleHeader" style="font-weight: bold; font-size: 14px; margin-bottom: 8px;"></div>
                    <div class="sub-tab-header" id="subTabHeaderFortune"></div>
                    <div id="subTabContainerFortune" style="margin-top: 10px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 脚本引入 -->
    <script src="dict.js"></script>
    <script src="personal.js"></script>
    <script src="ziwei.js"></script>
    <script src="app.js"></script>
</body>
</html>
